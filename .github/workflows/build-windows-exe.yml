name: Build Windows EXE (ConRQ)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download PHP Desktop
      run: |
        Invoke-WebRequest -Uri "https://github.com/cztomczak/phpdesktop/releases/download/chrome-v130.1/phpdesktop-chrome-130.1-php-8.3.zip" -OutFile phpdesktop.zip
        Expand-Archive -Path phpdesktop.zip -DestinationPath .\phpdesktop
        Remove-Item phpdesktop.zip

    - name: Prepare Application Bundle
      run: |
        # Remove default www directory
        Remove-Item -Recurse -Force .\phpdesktop\phpdesktop-chrome-130.1-php-8.3\www
        
        # Create new www directory and copy ConRQ files
        New-Item -ItemType Directory -Force -Path .\phpdesktop\phpdesktop-chrome-130.1-php-8.3\www
        
        # Copy necessary app files to www (excluding build tools)
        $exclude = @("github_trending", ".github", ".git", "phpdesktop", "php-desktop-settings.json")
        Get-ChildItem -Exclude $exclude | Copy-Item -Destination .\phpdesktop\phpdesktop-chrome-130.1-php-8.3\www -Recurse -Container
        
        # Apply secure configuration settings
        Copy-Item -Path .\php-desktop-settings.json -Destination .\phpdesktop\phpdesktop-chrome-130.1-php-8.3\settings.json -Force

    - name: Package Application
      run: |
        # Rename the executable to the app name
        cd .\phpdesktop\phpdesktop-chrome-130.1-php-8.3
        Rename-Item -Path "phpdesktop-chrome.exe" -NewName "ConRQ_App.exe"
        
        # Package the entire folder into a zip file for distribution
        cd ..\..
        Compress-Archive -Path .\phpdesktop\phpdesktop-chrome-130.1-php-8.3\* -DestinationPath ConRQ_App_Windows.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ConRQ-Windows-Executable
        path: ConRQ_App_Windows.zip
